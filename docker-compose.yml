version: "3.8"

services:
  db:
    image: postgres:15
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watcher}
      POSTGRES_DB: ${POSTGRES_DB:-watcher}
    volumes:
      - watcher-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watcher} -d ${POSTGRES_DB:-watcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-watcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watcher}
      POSTGRES_DB: ${POSTGRES_DB:-watcher}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  watcher-postgres:
